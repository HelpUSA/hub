openapi: 3.1.0
info:
  title: NexosAI Cloud Mesh - HelpUS Contract Draft
  version: 0.1.0-draft
  description: |
    CONTRACT DESIGN ONLY. No endpoint is declared implemented, deployed, reachable or authorized.
    Data synthetic and tenant-scoped. See ADR-020 and HUB issue #10.
servers:
  - url: http://127.0.0.1:0
    description: Placeholder for disposable contract fixture only; not a routable production endpoint.
tags:
  - name: Ingest
  - name: AdminRead
security: []
paths:
  /v1/mesh/nodes/{nodeId}/heartbeat:
    post:
      tags: [Ingest]
      operationId: postNodeHeartbeat
      summary: Future synthetic heartbeat ingestion, outbound node to NexosAI
      description: |
        Must validate bearer node identity and derive organization from token mapping.
        No client-supplied organizationId can grant access to another org.
        This is NOT a remote-command or shell API.
      security:
        - NodeBearer: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeHeartbeat'
      responses:
        '202':
          description: Valid new heartbeat accepted into sandbox ingestion queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '200':
          description: Identical idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/mesh/usage/aggregate:
    post:
      tags: [Ingest]
      operationId: postSyntheticUsageAggregate
      summary: Synthetic aggregate counters without chat content or customer PII
      description: All usage entries synthetic in initial scope; no billing or payment.
      security:
        - ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageAggregate' }
      responses:
        '202':
          description: Accepted (synthetic)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        '200':
          description: Identical replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/mesh/admin/nodes:
    get:
      tags: [AdminRead]
      operationId: listTenantNodes
      summary: Read-only node presence for authorized organization
      description: |
        Organization is derived from Admin user session. Never trust organizationId
        query strings or payload to authorize access. Returns UNKNOWN when unavailable.
      security:
        - AdminBearer: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Tenant-scoped nodes, never raw machine paths, IPs or credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, source, observedAt]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NodePresence' }
                  source: { $ref: '#/components/schemas/DataSource' }
                  observedAt: { type: string, format: date-time }
                  nextCursor: { type: [string, 'null'], maxLength: 128 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/mesh/admin/usage:
    get:
      tags: [AdminRead]
      operationId: getTenantUsage
      security:
        - AdminBearer: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Tenant-scoped aggregate metrics, not billing statements
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, source, observedAt]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UsageAggregate' } }
                  source: { $ref: '#/components/schemas/DataSource' }
                  observedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    NodeBearer:
      type: http
      scheme: bearer
      bearerFormat: 'JWT with node identity, org and mesh:heartbeat scope'
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: 'JWT with synthetic usage:write scope'
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: 'OIDC/JWT with verified user, org membership and role'
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{8,96}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    DataSource:
      type: string
      enum: [DEMO, LAB, LIVE]
    Ack:
      type: object
      additionalProperties: false
      required: [accepted, replay, correlationId]
      properties:
        accepted: { type: boolean }
        replay: { type: boolean }
        correlationId: { type: string, minLength: 8, maxLength: 128 }
    NodeHeartbeat:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, nodeId, observedAt, gatewayOk, runtimeReady, activeChatCount, source]
      properties:
        schemaVersion: { type: string, const: 'NodeHeartbeat.v1' }
        eventId: { type: string, minLength: 8, maxLength: 128 }
        nodeId: { type: string, pattern: '^[a-zA-Z0-9_-]{8,96}$' }
        observedAt: { type: string, format: date-time }
        gatewayOk: { type: boolean }
        runtimeReady: { type: boolean }
        activeChatCount: { type: integer, minimum: 0, maximum: 100000 }
        source: { $ref: '#/components/schemas/DataSource' }
    NodePresence:
      type: object
      additionalProperties: false
      required: [nodeId, status, lastSeenAt, source, observedAt]
      properties:
        nodeId: { type: string }
        displayName: { type: string, maxLength: 96 }
        nodeType: { type: string, enum: [LIGHT, FULL] }
        status: { type: string, enum: [ONLINE, IDLE, BUSY, DEGRADED, STALE, OFFLINE, RETIRED, UNKNOWN] }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        source: { $ref: '#/components/schemas/DataSource' }
        observedAt: { type: string, format: date-time }
        activeChatCount: { type: integer, minimum: 0 }
    UsageAggregate:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, windowStart, windowEnd, channel, requestCount, totalTokensUsed, source]
      properties:
        schemaVersion: { type: string, const: 'UsageAggregate.v1' }
        eventId: { type: string, minLength: 8, maxLength: 128 }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        channel: { type: string, enum: [WEBCHAT, WHATSAPP, API, SYSTEM] }
        requestCount: { type: integer, minimum: 0 }
        totalTokensUsed: { type: integer, minimum: 0 }
        latencyP95Ms: { type: [number, 'null'], minimum: 0 }
        source: { $ref: '#/components/schemas/DataSource' }
    Problem:
      type: object
      additionalProperties: false
      required: [code, correlationId]
      properties:
        code: { type: string }
        correlationId: { type: string }
  responses:
    BadRequest:
      description: Malformed, invalid or stale event
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Wrong tenant, role or scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Idempotency key replayed with a different payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Retry later with bounded backoff
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
